name: "🐛 Bug Report"
description: File a bug report or regression
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        *If this is a security vulnerability, please do NOT file a public issue.* Refer to our [Security Policy](https://github.com/bhubbard/.github/blob/main/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions or minimal reproducible example.
      placeholder: |
        1. Run `...`
        2. Execute `...`
        3. Observe error or unexpected response
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / Output
      description: What actually happened? (Include terminal logs, error responses, or backtraces)
      render: shell
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Low (Minor inconvenience or cosmetic)"
        - "Medium (Feature works unexpectedly or workarounds exist)"
        - "High (Core functionality broken or crash/panic)"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide OS, language/tool versions, and hardware details where applicable.
      placeholder: |
        - OS: macOS / Linux / Windows
        - Tool versions: ...
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Pre-submission Checks
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
